apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ordercred
      containers:
        - name: order-service
          image: didin8080/orders:4
          ports:
            - containerPort: 8004
          envFrom:
            - secretRef:
                name: order-env
          resources:
            limits:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "500m"
                memory: "512Mi"
